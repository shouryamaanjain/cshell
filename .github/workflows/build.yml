name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore cshell.sln

      - name: Build
        run: dotnet build src/CShell.App/CShell.App.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --no-restore

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/CShell.App/CShell.App.csproj -c Release -p:Platform=x64 -o publish

      - name: Create release artifact
        run: Compress-Archive -Path publish/* -DestinationPath cshell-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshell-win-x64
          path: cshell-win-x64.zip
